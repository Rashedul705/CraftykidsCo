# Nixpacks configuration for CraftyKidsCo Frontend (Next.js 16)
# Used by Coolify / Railway / Nixpacks deployment engines

[phases.setup]
nixPkgs = ["...", "chromium"]
aptPkgs = []

[variables]
PUPPETEER_SKIP_CHROMIUM_DOWNLOAD = "true"
PUPPETEER_EXECUTABLE_PATH = "/nix/var/nix/profiles/default/bin/chromium"
PORT = "3000"
HOSTNAME = "0.0.0.0"
NODE_ENV = "production"

[phases.install]
cmds = ["npm install"]

[phases.build]
cmds = ["npm run build"]

[start]
cmd = "npm start -- -p ${PORT:-3000} -H 0.0.0.0"
